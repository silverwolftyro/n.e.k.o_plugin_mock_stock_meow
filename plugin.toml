[plugin]
id = "mock_stock_meow"
name = "拟股喵喵"
version = "0.9.1"
entry = "plugin.plugins.mock_stock_meow:MockStockMeowPlugin"
description = "纯虚构反诈沙盘：养套杀 + 每日账单斩杀"
type = "plugin"

[plugin_runtime]
timeout = 30

[plugin.store]
enabled = true

[plugin.database]
enabled = true
name = "mock_stock_meow.db"

[plugin_state]
backend = "file"
persist_mode = "auto"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "market"
title = "拟股喵喵行情"
entry = "ui/panel.tsx"
context = "market"
permissions = ["state:read", "action:call"]
