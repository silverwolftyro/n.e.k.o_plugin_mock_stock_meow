[plugin]
id = "reverse_rich_sim"
name = "反向暴富模拟器"
version = "0.8.1"
entry = "plugin.plugins.reverse_rich_sim:ReverseRichSimPlugin"
description = "纯虚构反诈沙盘：养套杀 + 每日账单斩杀"
type = "plugin"

[plugin_runtime]
timeout = 30

[plugin.store]
enabled = true

[plugin.database]
enabled = true
name = "reverse_rich_sim.db"

[plugin_state]
backend = "file"
persist_mode = "auto"

[plugin.sdk]
recommended = ">=0.1.0,<0.2.0"
supported = ">=0.1.0,<0.3.0"

[plugin.i18n]
default_locale = "zh-CN"
locales_dir = "i18n"

[plugin.ui]
enabled = true

[[plugin.ui.panel]]
id = "market"
title = "反向暴富市场"
entry = "ui/panel.tsx"
context = "market"
permissions = ["state:read", "action:call"]
